<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Bedah Dompet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bedah Dompet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  :root { --bg: #F4F7F7; --fg: #202D30; --muted: #576A69; --acc: #237D80; --on-acc: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B1314; --fg: #E3ECEC; --muted: #93A6A6; --acc: #4FB7BA; --on-acc: #061112; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px 20px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  p { margin: 0; max-width: 32em; color: var(--muted); }
  a.tombol { display: inline-block; padding: 12px 20px; border-radius: 12px; background: var(--acc); color: var(--on-acc); text-decoration: none; font-weight: 600; }
  ol { text-align: left; color: var(--muted); padding-left: 1.2em; max-width: 32em; }
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1 id="judul">Bedah Dompet</h1>
  <div id="pasang" hidden>
    <ol>
      <li>Ketuk tombol <b>Bagikan</b> di Safari.</li>
      <li>Pilih <b>Tambah ke Layar Utama</b>, lalu <b>Tambah</b>.</li>
      <li>Buka Bedah Dompet dari ikon di layar utama.</li>
    </ol>
  </div>
  <div id="buka" hidden>
    <p id="status">Membuka Bedah Dompet…</p>
    <p><a class="tombol" id="manual" href="#">Buka Bedah Dompet</a></p>
  </div>
  <p id="atur" hidden>Penjual: isi ALAMAT_APLIKASI di file ini dengan alamat /exec.</p>
</main>
<script>
(function () {
  'use strict';
  /* UJI SAJA. Isi dengan alamat aplikasi pusat (Apps Script › Terapkan › Kelola deployment), berakhiran /exec */
  var ALAMAT_APLIKASI = 'TEMPEL_ALAMAT_EXEC_DI_SINI';

  var pola = /^https:\/\/script\.google\.com\/(a\/[\w.-]+\/)?macros\/s\/[\w-]+\/exec$/;
  var $ = function (id) { return document.getElementById(id); };
  var terpasang = false;
  try { terpasang = navigator.standalone === true; } catch (e) { /* abaikan */ }

  if (!pola.test(ALAMAT_APLIKASI)) { $('atur').hidden = false; return; }
  $('manual').href = ALAMAT_APLIKASI;

  if (terpasang) {
    /* Dibuka dari ikon layar utama: pindah ke aplikasi (navigasi biasa, bukan iframe, agar login Google jalan) */
    $('buka').hidden = false;
    setTimeout(function () { location.replace(ALAMAT_APLIKASI); }, 400);
  } else {
    /* Dibuka di Safari: tampilkan cara pasang, jangan langsung pindah */
    $('pasang').hidden = false;
  }
})();
</script>
</body>
</html>
